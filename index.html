<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#3f948a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<title>바다 구조대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf7ef; --card:#fffdf8; --ink:#1f4b47; --ink-soft:#5b7c78;
  --teal:#3f948a; --teal-soft:#d8eeea; --coral:#e2644f; --coral-soft:#fde3dc;
  --lilac:#b7a4d9; --sand:#f3e7cf; --gold:#f4b544;
  --shadow:0 6px 20px rgba(31,75,71,.10);
  --radius:22px;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"Gowun Dodum",system-ui,sans-serif; font-size:17px;
  -webkit-tap-highlight-color:transparent;
  min-height:100vh;
  background-image:
    radial-gradient(circle at 8% 12%, #e6f4f1 0, transparent 30%),
    radial-gradient(circle at 92% 6%, #fde9e2 0, transparent 26%),
    radial-gradient(circle at 50% 110%, #dff0ee 0, transparent 45%);
}
h1,h2,h3,.jua{font-family:"Jua","Gowun Dodum",sans-serif;font-weight:400;margin:0}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,select{font:inherit;color:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:16px 16px 60px}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;margin-bottom:14px}
.title h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1px;line-height:1.05}
.title h1 em{font-style:normal;color:var(--coral)}
.title p{margin:4px 0 0;color:var(--ink-soft);font-size:15px}
.head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.clock{background:var(--card);padding:8px 14px;border-radius:999px;box-shadow:var(--shadow);font-size:15px;color:var(--ink-soft)}
.icon-btn{background:var(--card);border-radius:999px;padding:8px 14px;box-shadow:var(--shadow);font-size:15px}
.icon-btn:active{transform:scale(.96)}

/* student tabs */
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 2px 12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;display:flex;align-items:center;gap:8px;background:var(--card);padding:10px 18px 10px 12px;border-radius:999px;box-shadow:var(--shadow);font-family:"Jua";font-size:19px;border:3px solid transparent;transition:.15s}
.tab .em{width:34px;height:34px;display:block}
.tab.on{border-color:var(--teal);background:#effaf7}
.tab.add{color:var(--teal);padding:10px 18px}
.tab .dot{width:9px;height:9px;border-radius:50%;background:var(--coral);margin-left:2px}

/* layout */
.grid{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
.grid > div{min-width:0}
@media(min-width:920px){.grid{grid-template-columns:minmax(0,1.25fr) minmax(0,1fr)}}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px}
.card h2{font-size:24px;display:flex;align-items:center;gap:8px}
.muted{color:var(--ink-soft)}

/* profile */
.profile{display:flex;gap:16px;align-items:center}
.buddy{flex:none;width:96px;height:96px;border-radius:26px;background:var(--teal-soft);display:grid;place-items:center;position:relative;padding:6px}
.buddy .lv{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--coral);color:#fff;font-family:"Jua";font-size:15px;padding:2px 10px;border-radius:999px;white-space:nowrap}
.pinfo{flex:1;min-width:0}
.pname{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pname h2{font-size:28px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:14px;background:var(--sand);padding:3px 10px;border-radius:999px}
.chip.edit{background:transparent;border:1.5px solid #d9e6e3;color:var(--ink-soft)}
.xp{margin-top:10px;display:flex;align-items:center;gap:10px}
.bar{flex:1;height:14px;background:#eef3f1;border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#f6a35b,var(--coral));border-radius:999px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.xp b{font-size:14px;color:var(--ink-soft);font-weight:400;min-width:64px;text-align:right}
.stats{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.stat{background:#f5f1e8;border-radius:14px;padding:6px 12px;font-size:15px}
.stat b{font-family:"Jua";font-weight:400;font-size:19px;color:var(--ink)}

/* mission */
.mission{margin-top:16px;position:relative;overflow:hidden}
.mission-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.rule{font-size:15px;color:var(--ink-soft)}
.stage{display:flex;align-items:center;gap:12px;margin-top:14px}
svg.art{display:block;width:100%;height:100%;overflow:visible}
.animal-box{flex:none;width:200px;height:200px;border-radius:28px;display:grid;place-items:center;position:relative;overflow:hidden}
.animal-box .ani{width:92%;height:92%;transition:transform .4s}
.animal-box svg.net{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.net .fall{animation:netfall 1.1s ease-in forwards;transform-box:fill-box;transform-origin:center}
@keyframes netfall{0%{opacity:1}100%{transform:translateY(46px) rotate(14deg);opacity:0}}
.net .stub.new{animation:fray .5s ease-out}
@keyframes fray{from{opacity:0}}
.animal-box.wiggle .ani{animation:wiggle .6s}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.05)}75%{transform:rotate(10deg) scale(1.05)}}
.animal-name{text-align:center;font-family:"Jua";font-size:18px;margin-top:6px}

.chain{flex:1;min-width:0;display:flex;flex-wrap:nowrap;align-items:center;padding:22px 6px 0 0}
.link{position:relative;flex:none;width:min(62px,15%);aspect-ratio:1;border-radius:50%;border:6px solid var(--teal);margin-right:-6px;background:transparent;display:grid;place-items:center;transition:.3s}
.link .n{position:absolute;top:-24px;left:50%;transform:translateX(-50%);font-family:"Jua";font-size:17px;color:var(--ink)}
.link.broken{border-color:transparent;}
.link.broken::before,.link.broken::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:6px solid #f1b3a6;clip-path:polygon(0 0,46% 0,46% 100%,0 100%)}
.link.broken::before{transform:rotate(-18deg) translateX(-3px)}
.link.broken::after{clip-path:polygon(54% 0,100% 0,100% 100%,54% 100%);transform:rotate(18deg) translateX(3px)}
.link.broken .ok{font-size:20px;color:var(--coral);font-family:"Jua"}
.link.next{animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(63,148,138,.35)}50%{box-shadow:0 0 0 10px rgba(63,148,138,0)}}
.link.snap{animation:snap .5s}
@keyframes snap{0%{transform:scale(1)}30%{transform:scale(1.35) rotate(-12deg)}60%{transform:scale(.85) rotate(8deg)}100%{transform:scale(1)}}

.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:18px}
.big-btn{flex:1;min-width:230px;background:var(--coral);color:#fff;font-family:"Jua";font-size:22px;padding:16px 20px;border-radius:18px;box-shadow:0 6px 0 #c24c39;transition:transform .08s}
.big-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #c24c39}
.big-btn[disabled]{background:#cfe3df;color:var(--ink);box-shadow:0 6px 0 #b4cfca;cursor:default}
.small-link{font-size:14px;color:var(--ink-soft);text-decoration:underline;text-underline-offset:3px;padding:6px}
.reward{position:absolute;right:16px;top:16px;background:var(--coral-soft);color:#b8452f;font-family:"Jua";padding:5px 12px;border-radius:999px;font-size:15px}

/* quests */
.q-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.q-list{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.q{display:flex;align-items:center;gap:12px;background:#f7f4ec;border-radius:16px;padding:12px 12px}
.q .check{flex:none;width:34px;height:34px;border-radius:11px;border:2.5px solid #c7d8d4;background:#fff;display:grid;place-items:center;color:#fff;font-size:20px;transition:.15s}
.q.done .check{background:var(--teal);border-color:var(--teal)}
.q .txt{flex:1;min-width:0;font-size:17px}
.q.done .txt{text-decoration:line-through;color:#9bb0ad}
.q .pts{font-family:"Jua";color:#d98b1f;background:#fff4dc;padding:3px 9px;border-radius:999px;font-size:15px}
.q.done .pts{opacity:.5}
.q .del{color:#b9c6c4;font-size:20px;padding:4px 6px}
.q-add{display:flex;gap:8px;margin-top:12px}
.q-add input{flex:1;min-width:0;border:2px solid #e4ebe9;border-radius:14px;padding:10px 12px;background:#fff}
.q-add select{border:2px solid #e4ebe9;border-radius:14px;padding:10px 8px;background:#fff}
.q-add button{background:var(--coral);color:#fff;border-radius:14px;width:48px;font-size:24px}
.q-progress{font-size:15px;color:var(--ink-soft)}

/* dex */
.dex,.words{margin-top:16px}
/* 단어장 (선생님) */
.w-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.w-chip{display:inline-flex;align-items:center;gap:6px;background:#f7f4ec;border-radius:999px;padding:5px 6px 5px 12px;font-size:15px}
.w-chip small{color:var(--ink-soft);font-size:14px}
.w-chip button{color:#b9c6c4;font-size:17px;padding:0 4px}
.words textarea{width:100%;min-height:160px;border:2px solid #e4ebe9;border-radius:14px;padding:10px 12px;font:inherit;background:#fff}
/* 보너스 퀴즈 */
.quiz-btn{flex:1;min-width:230px;background:var(--gold);color:#5a3b00;font-family:"Jua";font-size:21px;padding:14px 20px;border-radius:18px;box-shadow:0 6px 0 #d1932a;animation:pulse 1.6s infinite}
.quiz-btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d1932a}
.bonus-note{font-size:15px;color:var(--ink-soft);padding:4px 6px}
.quiz{text-align:center}
.q-dots{display:flex;justify-content:center;gap:8px;margin-bottom:8px}
.q-dots i{width:14px;height:14px;border-radius:50%;background:#e6ecea}
.q-dots i.ok{background:var(--teal)} .q-dots i.now{background:var(--gold)}
.q-word{font-family:"Jua";font-size:clamp(34px,8vw,48px);color:var(--ink);margin:4px 0 16px;word-break:break-word}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice{background:#f5f1e8;border-radius:16px;padding:16px 10px;font-size:19px;border:3px solid transparent;transition:.15s}
.choice.ok{background:#dff3ee;border-color:var(--teal)}
.choice.no{background:var(--coral-soft);border-color:var(--coral)}
.choice[disabled]{cursor:default}
.q-msg{min-height:1.5em;font-family:"Jua";font-size:19px;margin:14px 0 0}
.dex-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:12px}
.dex-item{background:#f7f4ec;border-radius:18px;padding:10px 4px 8px;text-align:center}
.dex-item .e{width:64px;height:64px;margin:0 auto}
.dex-item .nm{font-size:14px;margin-top:4px}
.dex-item.locked .e{filter:grayscale(1) brightness(.2);opacity:.18}
.dex-item.locked .nm{color:#b5c1bf}
.dex-item.now{outline:3px dashed var(--teal);outline-offset:-3px}
.dex-item.got{background:#eaf6f3}

/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(20,45,42,.45);display:grid;place-items:center;padding:16px;z-index:50;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--card);border-radius:28px;padding:22px;width:min(520px,100%);max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(0,0,0,.25);animation:pop .3s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.modal h3{font-size:26px;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.field input{border:2px solid #e4ebe9;border-radius:14px;padding:10px 12px;background:#fff}
.pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(60px,1fr));gap:8px}
.pick button{background:#f5f1e8;border-radius:14px;padding:4px;border:3px solid transparent;aspect-ratio:1}
.pick button.on{border-color:var(--teal);background:#e8f6f2}
.pick button[disabled]{opacity:.25}
.m-actions{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{padding:11px 18px;border-radius:14px;background:#eef3f1;font-family:"Jua";font-size:17px}
.btn.primary{background:var(--teal);color:#fff}
.btn.danger{background:transparent;color:var(--coral)}

.celebrate{text-align:center}
.celebrate .swim{width:170px;height:170px;display:inline-block;animation:swim 2.4s ease-in-out infinite}
@keyframes swim{0%,100%{transform:translate(-30px,0) rotate(-6deg)}50%{transform:translate(30px,-14px) rotate(6deg)}}
.celebrate h3{font-size:32px;color:var(--coral)}
.stickers{font-size:34px;letter-spacing:6px;margin:6px 0 4px}

/* toast + confetti */
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 22px;border-radius:999px;font-family:"Jua";font-size:18px;z-index:80;animation:toast 2.4s forwards;white-space:nowrap}
@keyframes toast{0%{opacity:0;transform:translate(-50%,20px)}10%,80%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,10px)}}
.confetti{position:fixed;top:-20px;width:10px;height:14px;z-index:90;pointer-events:none;border-radius:3px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.bubble{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(63,148,138,.35);pointer-events:none;animation:rise linear forwards}
@keyframes rise{to{transform:translateY(-190px);opacity:0}}

.t-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;background:#fff4dc;border:2px dashed #f0c56b;border-radius:18px;padding:10px 14px;margin-bottom:12px;font-size:15px}
.t-bar b{font-family:"Jua";font-weight:400;font-size:18px}
body.teacher{background-color:#fbf3e6}
.t-door{font-size:13px;color:#b6c4c1;padding:8px 14px;border-radius:999px}
.t-door:active{background:#eef3f1}
.foot{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center;font-size:14px;color:var(--ink-soft)}
@media(max-width:560px){
  .stage{flex-direction:column}
  .animal-box{width:180px;height:180px}
  .chain{justify-content:center;width:100%;flex:none}
  .reward{position:static;display:inline-block;margin-top:6px}
}
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script>
/* ---------- 데이터 ---------- */
const ANIMALS = [
  {id:'dolphin', e:'🐬', name:'돌고래',   bg:'#dcecf6'},
  {id:'crab',    e:'🦀', name:'꽃게',     bg:'#fde3dc'},
  {id:'turtle',  e:'🐢', name:'바다거북', bg:'#e1f1e4'},
  {id:'octopus', e:'🐙', name:'문어',     bg:'#ece4f6'},
  {id:'whale',   e:'🐳', name:'고래',     bg:'#d9eef6'},
  {id:'seal',    e:'🦭', name:'물범',     bg:'#ebe8e3'},
  {id:'penguin', e:'🐧', name:'펭귄',     bg:'#e4ebf3'},
  {id:'fish',    e:'🐠', name:'열대어',   bg:'#fff0d6'},
  {id:'puffer',  e:'🐡', name:'복어',     bg:'#f6f0d8'},
  {id:'shark',   e:'🦈', name:'상어',     bg:'#dfe8ee'},
  {id:'squid',   e:'🦑', name:'오징어',   bg:'#fbe2e8'},
  {id:'shrimp',  e:'🦐', name:'새우',     bg:'#fde6d6'},
];
/* ---------- 그림 (수채화 느낌 SVG, 200x200) ---------- */
const sk = c => `stroke="${c}" stroke-opacity=".55" stroke-width="1.8" stroke-linejoin="round"`;
const eye = (x, y, r = 3.6) => `<circle cx="${x}" cy="${y}" r="${r}" fill="#23303b"/><circle cx="${x - r*.3}" cy="${y - r*.38}" r="${r*.4}" fill="#fff"/>`;
const blush = (x, y) => `<ellipse cx="${x}" cy="${y}" rx="7" ry="4" fill="#f49a9a" opacity=".45"/>`;
const ln = (d, c, w = 1.8, extra = '') => `<path d="${d}" stroke="${c}" stroke-width="${w}" fill="none" stroke-linecap="round" ${extra}/>`;
const shine = d => ln(d, '#fff', 5, 'stroke-opacity=".38"');
const spots = (list, c, o = .45) => list.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" opacity="${o}"/>`).join('');
const mirror = s => `${s}<g transform="translate(200 0) scale(-1 1)">${s}</g>`;

const crabHalf = `
  ${ln('M60,116 C42,114 28,122 20,138', '#d9603f', 7)}${ln('M62,126 C46,132 36,144 33,160', '#d9603f', 7)}${ln('M70,134 C60,146 56,158 57,172', '#d9603f', 7)}
  ${ln('M62,100 C50,94 44,84 45,70', '#e0704a', 10)}
  <path d="M22,60 C16,42 30,28 47,30 C60,32 66,45 60,57 L49,51 C47,45 40,43 36,48 C33,54 39,60 48,60 L55,66 C47,75 29,75 22,60Z" fill="url(#gCrab)" ${sk('#a8432a')}/>
  ${spots([[30,58,2.2],[40,38,2],[52,40,1.8]], '#ffd0b4', .7)}
  ${ln('M88,86 L85,66', '#d9603f', 4)}${eye(85, 63, 5)}`;
const octoArms = ['M66,100 C42,104 24,96 18,80 C14,68 26,62 32,72','M72,108 C50,124 30,128 22,146 C16,160 28,170 37,161','M84,114 C76,140 58,152 59,172 C61,185 76,185 75,174','M100,116 C101,140 92,160 100,180 C106,190 119,185 113,176','M116,114 C126,138 145,148 145,168 C145,181 131,183 131,173','M128,108 C150,122 171,124 178,142 C182,156 168,163 164,152','M134,100 C158,104 176,96 182,80 C186,68 174,62 168,72'];
const squidArms = Array.from({length: 8}, (_, i) => { const x = 81 + i * 5.4, w = (i % 2 ? 7 : -7); return `M${x},126 C${x + w},144 ${x - w},158 ${x + w * .6},${170 + (i % 3) * 4}`; });
/* 새우 몸통: C자 곡선을 따라 껍데기 마디를 꼬리부터 겹쳐 그림 */
const SR = 40, shrimpSeg = k => { const th = (-62 + k * 26) * Math.PI / 180; return {th, t: 20 - k * 1.5, x: 124 + SR * Math.cos(th), y: 104 + SR * Math.sin(th)}; };
const shrimpBody = Array.from({length: 8}, (_, i) => 7 - i).map(k => { const s = shrimpSeg(k), deg = (s.th * 180 / Math.PI).toFixed(1);
  return `<ellipse cx="${s.x.toFixed(1)}" cy="${s.y.toFixed(1)}" rx="${s.t.toFixed(1)}" ry="${(s.t * .95).toFixed(1)}" transform="rotate(${deg} ${s.x.toFixed(1)} ${s.y.toFixed(1)})" fill="url(#gShrimp)" ${sk('#b44f25')}/>`; }).join('');
const shrimpTail = (() => { const s = shrimpSeg(7.15); return `translate(${s.x.toFixed(1)} ${s.y.toFixed(1)}) rotate(${(s.th * 180 / Math.PI + 90).toFixed(1)})`; })();
const shrimpLegs = [1, 2, 3, 4, 5].map(k => { const s = shrimpSeg(k), ix = 124 + (SR - s.t) * Math.cos(s.th), iy = 104 + (SR - s.t) * Math.sin(s.th);
  return ln(`M${ix.toFixed(1)},${iy.toFixed(1)} L${(ix - 11 * Math.cos(s.th) + 3).toFixed(1)},${(iy - 11 * Math.sin(s.th) + 4).toFixed(1)}`, '#e8794a', 2.6); }).join('');
const pufferSpikes = Array.from({length: 18}, (_, i) => {
  const a = i / 18 * Math.PI * 2, p = (ang, r) => `${(100 + Math.cos(ang) * r).toFixed(1)},${(105 + Math.sin(ang) * r).toFixed(1)}`;
  return `<path d="M${p(a - .07, 60)} L${p(a, 74)} L${p(a + .07, 60)}Z" fill="#d49a3c"/>`;
}).join('');

const ART = {
  dolphin: `
    <path d="M30,176 q-6,-8 0,-14 q6,6 0,14z M20,160 q-4,-6 0,-10 q4,4 0,10z" fill="#9cc7e3" opacity=".8"/>
    <path d="M50,154 C42,162 28,168 14,167 C24,158 30,148 33,137 C38,148 44,152 50,154Z" fill="url(#gDol)" ${sk('#3d5f86')}/>

const LINKS = 7, LINK_XP = 30, RESCUE_XP = 50, STICKERS = 3, KEY = 'sea-rescue-v1';
const A = id => ANIMALS.find(a => a.id === id) || ANIMALS[0];

const today = () => { const d = new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); };
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function defaultQuests(){
  return [
    {id:uid(), text:'영어 지문 한 개 읽기', xp:20, done:false},
    {id:uid(), text:'모르는 단어 3개 찾기', xp:15, done:false},
    {id:uid(), text:'소리 내어 한 번 읽기', xp:15, done:false},
  ];
}
function makeStudent(name, grade, buddy){
  return {id:uid(), name, grade, buddy, xp:0, stickers:0, rescued:[],
    current:{animal:'dolphin', links:0, log:[]}, quests:defaultQuests(), questDate:today(), words:[]};
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.students)){ s.students.forEach(st => { if (!Array.isArray(st.words)) st.words = []; }); return s; } } catch(e){}
  const st = makeStudent('예시 학생', '초3', 'dolphin');
  return {students:[st], selected:st.id, sound:true};
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){} }
let state = load();
const cur = () => state.students.find(s => s.id === state.selected) || state.students[0];

/* 날짜가 바뀌면 오늘의 퀘스트 체크를 풀어 줌 (XP는 그대로) */
function dailyReset(){
  const t = today();
  state.students.forEach(s => { if (s.questDate !== t){ s.quests.forEach(q => q.done = false); s.questDate = t; } });
}

/* ---------- 소리 ---------- */
let ac;
function tone(notes){
  if (!state.sound) return;
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    notes.forEach(([f, t, d]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = 'triangle'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, ac.currentTime + t);
      g.gain.exponentialRampToValueAtTime(0.18, ac.currentTime + t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + t + d);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime + t); o.stop(ac.currentTime + t + d + 0.05);
    });
  } catch(e){}
}
const sfx = {
  check: () => tone([[660,0,.12],[880,.08,.18]]),
  snap:  () => tone([[523,0,.1],[784,.07,.12],[1046,.14,.25]]),
  rescue:() => tone([[523,0,.2],[659,.15,.2],[784,.3,.2],[1046,.45,.5]]),
  level: () => tone([[784,0,.15],[988,.12,.15],[1318,.24,.4]]),
};

/* ---------- 효과 ---------- */
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2500);
}
function confetti(n = 60){
  const colors = ['#e2644f','#3f948a','#f4b544','#b7a4d9','#7cc4e4','#f6a35b'];
  for (let i = 0; i < n; i++){
    const c = document.createElement('div'); c.className = 'confetti';
    c.style.left = Math.random()*100 + 'vw';
    c.style.background = colors[i % colors.length];
    c.style.animationDuration = (1.8 + Math.random()*1.6) + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    document.body.appendChild(c); setTimeout(() => c.remove(), 4000);
  }
}
function bubbles(el){
  for (let i = 0; i < 8; i++){
    const b = document.createElement('span'); b.className = 'bubble';
    const size = 8 + Math.random()*16;
    b.style.width = b.style.height = size + 'px';
    b.style.left = (10 + Math.random()*80) + '%';
    b.style.animationDuration = (1 + Math.random()) + 's';
    el.appendChild(b); setTimeout(() => b.remove(), 2200);
  }
}

/* ---------- 동작 ---------- */
const level = s => Math.floor(s.xp / 100) + 1;
function addXP(s, n){
  const before = level(s);
  s.xp = Math.max(0, s.xp + n);
  if (level(s) > before){ setTimeout(() => { sfx.level(); toast(`🎉 레벨 업! Lv.${level(s)}`); }, 450); }
}
function breakLink(force){
  const s = cur(), c = s.current;
  if (c.links >= LINKS) return;
  if (!force && s.lastBreak === today()) return;
  c.links++; c.log.push(today()); s.lastBreak = today(); addXP(s, LINK_XP);
  save(); render({snap: c.links - 1});
  sfx.snap();
  const box = document.querySelector('.animal-box'); if (box){ box.classList.add('wiggle'); bubbles(box); }
  if (c.links >= LINKS) setTimeout(rescue, 700);
}
function undoLink(){
  const s = cur(), c = s.current;
  if (!c.links) return;
  if (!confirm('마지막으로 끊은 고리를 다시 이을까요?')) return;
  c.links--; c.log.pop(); s.lastBreak = c.log[c.log.length-1] || null; addXP(s, -LINK_XP); save(); render();
}
function rescue(){

const shuffle = arr => { for (let i = arr.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [arr[i], arr[j]] = [arr[j], arr[i]]; } return arr; };
const QUIZ_N = 3;
const quizReady = s => new Set((s.words || []).map(w => w.ko)).size >= 4;   /* 보기 4개를 만들 수 있어야 함 */
const bonusToday = s => s.bonus && s.bonus.date === today() ? s.bonus : null;
function addWord(s, en, ko){
  en = en.trim(); ko = ko.trim(); if (!en || !ko) return false;
  const old = s.words.find(w => w.en.toLowerCase() === en.toLowerCase());
  if (old) old.ko = ko; else s.words.push({id:uid(), en, ko});
  return true;
}

function startQuiz(){
  const s = cur();
  if (!quizReady(s) || bonusToday(s)) return;
  s.bonus = {date: today(), won: false}; save();          /* 시작하면 오늘 도전 1번을 쓴 것으로 셈 */
  const qs = shuffle([...s.words]).slice(0, QUIZ_N);
  let i = 0;
  const show = () => {
    const w = qs[i];
    const wrong = shuffle([...new Set(s.words.map(x => x.ko))].filter(k => k !== w.ko)).slice(0, 3);
    const opts = shuffle([w.ko, ...wrong]);
    openModal(`<div class="quiz" id="quiz">
      <div class="q-dots">${qs.map((_, k) => `<i class="${k < i ? 'ok' : k === i ? 'now' : ''}"></i>`).join('')}</div>

      <div class="q-word">${esc(w.en)}</div>
      <div class="choices">${opts.map(o => `<button class="choice" data-o="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <p class="q-msg" id="qMsg"></p><div id="qEnd"></div></div>`);
    const btns = [...document.querySelectorAll('.choice')];
    btns.forEach(b => b.onclick = () => {

        b.classList.add('ok'); sfx.check(); msg.textContent = '정답! 👏';

        b.classList.add('no'); btns.find(x => x.dataset.o === w.ko).classList.add('ok');

    s.bonus.won = true; save(); closeModal();

    breakLink(true);
  };
  show();
}

/* ---------- 화면 ---------- */
/* 그물: 마름모 매듭 그물을 7조각으로 나눠 두고, 고리를 하나 끊을 때마다 가운데부터 한 조각씩 뜯겨 나감 */
const NET = (() => {
  let seed = 20261116; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647;
  const W = 22, H = 12, edge = x => 64 + x * 0.24;            /* 윗줄(밧줄) 위치 */
  const pts = {}; const P = (i, j) => { const k = i + ',' + j;
    return pts[k] || (pts[k] = {id:k, x:+(i*W + (j%2 ? W/2 : 0) + (rnd()-.5)*3).toFixed(1), y:+(48 + j*H + (rnd()-.5)*3).toFixed(1)}); };
  const segs = [];
  for (let j = 0; j < 14; j++) for (let i = -1; i <= 10; i++){
    const a = P(i, j), nb = j % 2 ? [P(i, j+1), P(i+1, j+1)] : [P(i-1, j+1), P(i, j+1)];
    nb.forEach(b => { const mx = (a.x+b.x)/2, my = (a.y+b.y)/2;
      if (my > edge(mx) + 2 && mx > -12 && mx < 212) segs.push({a, b, d: Math.hypot(mx-104, my-120) + rnd()*34}); });
  }
  segs.sort((p, q) => p.d - q.d).forEach((s, i) => s.g = Math.min(LINKS - 1, Math.floor(i * LINKS / segs.length)));
  const rope = Array.from({length: 23}, (_, k) => { const x = -10 + k * 10; return `${x},${(edge(x) + Math.sin(k / 22 * Math.PI) * 7).toFixed(1)}`; }).join(' ');
  return {segs, rope, edge};
})();
function netSVG(links, snap){
  const alive = new Map();
  NET.segs.forEach(s => { if (s.g >= links){ alive.set(s.a.id, s.a); alive.set(s.b.id, s.b); } });
  let mesh = '', torn = '', falling = '';
  NET.segs.forEach(s => {
    const seg = `M${s.a.x},${s.a.y} L${s.b.x},${s.b.y}`;
    if (s.g >= links){ mesh += seg + ' '; return; }
    if (s.g === snap) falling += `<path class="fall" d="${seg}" style="animation-delay:${(Math.random()*.25).toFixed(2)}s"/>`;
    /* 끊긴 실: 아직 남은 매듭에서 짧게 늘어진 끄트머리 */
    [[s.a, s.b], [s.b, s.a]].forEach(([p, q]) => {
      if (!alive.has(p.id)) return;
      const ex = p.x + (q.x - p.x) * .34, ey = p.y + (q.y - p.y) * .34 + 4;
      torn += `<path class="stub ${s.g === snap ? 'new' : ''}" d="M${p.x},${p.y} Q${((p.x+ex)/2).toFixed(1)},${(p.y + 1).toFixed(1)} ${ex.toFixed(1)},${ey.toFixed(1)}"/>`;
    });
  });
  const knots = [...alive.values()].map(p => `<circle cx="${p.x}" cy="${p.y}" r="1.7"/>`).join('');
  const ropeOn = links < LINKS, ropeFall = snap === LINKS - 1;
  const sag = Math.min(links, LINKS - 1) * 2.5;              /* 끊을수록 그물이 조금씩 축 처짐 */
  return `<svg class="net" viewBox="0 0 200 200" aria-hidden="true">
    <g transform="translate(0 ${sag})" fill="none" stroke-linecap="round">
      <path d="${mesh}" stroke="#fffaf0" stroke-opacity=".7" stroke-width="3"/>
      <path d="${mesh}" stroke="#8f8878" stroke-width="1.5"/>
      <g stroke="#8f8878" stroke-width="1.4">${torn}${falling}</g>
      <g fill="#7d7666">${knots}</g>
      ${ropeOn || ropeFall ? `<polyline class="${ropeFall ? 'fall' : ''}" points="${NET.rope}" stroke="#8a7d62" stroke-width="3.6"/>
        <polyline class="${ropeFall ? 'fall' : ''}" points="${NET.rope}" stroke="#c9b991" stroke-width="1.4" stroke-dasharray="3 3"/>` : ''}
    </g></svg>`;
}

              : bonus && bonus.won
                ? `<button class="big-btn" disabled>보너스 고리까지 끊었어요! 대단해요 🌟</button>`
                : `<button class="big-btn" disabled>오늘 고리 끊기 완료! 내일 또 만나요 🌊</button>`}
            ${canQuiz ? `<button class="quiz-btn" id="quizBtn">🎯 퀴즈 풀고 하나 더!</button>` : ''}
          </div>
          ${bonus && !bonus.won ? `<div class="bonus-note">오늘 퀴즈는 도전했어요. 내일 또 도전해요 💪</div>` : ''}
          ${T ? `<div class="actions" style="margin-top:6px">
            ${doneToday && links < LINKS ? `<button class="small-link" id="forceBtn">밀린 날 채우기(하나 더 끊기)</button>` : ''}
            ${links ? `<button class="small-link" id="undoBtn">마지막 고리 되돌리기</button>` : ''}
            <button class="small-link" id="swapBtn">구할 친구 바꾸기</button>
            ${bonus ? `<button class="small-link" id="quizReset">오늘 퀴즈 다시 열어 주기</button>` : ''}
          </div>` : ''}
        </section>
      </div>

      <div>
        <section class="card">
          <div class="q-head">
            <h2>⭐ 오늘의 퀘스트</h2>
            <span class="q-progress">${qDone}/${s.quests.length}</span>
          </div>
          <ul class="q-list">
            ${s.quests.map(q => `
              <li class="q ${q.done?'done':''}">
                <button class="check" data-q="${q.id}" aria-label="완료">${q.done?'✓':''}</button>
                <span class="txt">${esc(q.text)}</span>
                <span class="pts">+${q.xp}</span>
                ${T ? `<button class="del" data-del="${q.id}" aria-label="삭제">×</button>` : ''}
              </li>`).join('') || `<li class="muted">${T ? '퀘스트를 추가해 보세요' : '오늘은 퀘스트가 없어요'}</li>`}
          </ul>
          ${T ? `<div class="q-add">
            <input id="qText" placeholder="퀘스트 추가 (예: 단어 5개 외우기)" maxlength="30">
            <select id="qXp"><option>10</option><option>15</option><option selected>20</option><option>30</option></select>
            <button id="qAdd" aria-label="추가">＋</button>
          </div>
          <div style="text-align:right;margin-top:8px"><button class="small-link" id="qReset">체크 모두 풀기</button></div>` : ''}
        </section>

        ${T ? `<section class="card words">
          <div class="q-head"><h2>📝 단어장</h2><span class="q-progress">${s.words.length}개</span></div>
          <p class="muted" style="font-size:14px;margin:6px 0 0">${esc(s.name)} 학생의 보너스 퀴즈에 나와요. 뜻이 서로 다른 단어가 4개 이상이면 퀴즈가 열려요.${quizReady(s) ? '' : ' <b style="color:var(--coral)">(아직 부족해요)</b>'}</p>
          <div class="w-list">${s.words.map(w => `<span class="w-chip">${esc(w.en)} <small>${esc(w.ko)}</small><button data-wdel="${w.id}" aria-label="삭제">×</button></span>`).join('')}</div>
          <div class="q-add">
            <input id="wEn" placeholder="영어 (예: ocean)" maxlength="30" autocapitalize="off">
            <input id="wKo" placeholder="뜻 (예: 바다)" maxlength="30">
            <button id="wAdd" aria-label="단어 추가">＋</button>
          </div>
          <div style="text-align:right;margin-top:8px"><button class="small-link" id="wBulk">여러 개 한꺼번에 넣기</button></div>
        </section>` : ''}

        <section class="card dex">
          <h2>📖 바다 친구 도감 <span class="q-progress" style="margin-left:auto">${s.rescued.length}/${ANIMALS.length}</span></h2>
          <div class="dex-grid">
            ${ANIMALS.map(x => {
              const got = s.rescued.includes(x.id), now = x.id === a.id && !got;
              return `<div class="dex-item ${got?'got':'locked'} ${now?'now':''}">
                <div class="e">${art(x.id)}</div><div class="nm">${got ? esc(x.name) : (now ? '구조 중' : '???')}</div></div>`;
            }).join('')}
          </div>
        </section>
      </div>
    </div>
    ${T ? '<p class="foot">기록은 이 기기 브라우저에 저장돼요 · 가끔 ⚙️에서 백업 파일을 받아 두세요</p>'
        : '<p class="foot"><button class="t-door" id="toTeacher">선생님</button></p>'}
  `;

  /* 이벤트 연결 */
  document.querySelectorAll('[data-sid]').forEach(b => b.onclick = () => { state.selected = b.dataset.sid; save(); render(); });
  const on = (id, fn, ev = 'onclick') => { const el = document.getElementById(id); if (el) el[ev] = fn; };
  /* 학생 화면에서도 되는 것: 학생 고르기, 고리 끊기, 퀘스트 체크, 선생님 화면 들어가기 */
  on('breakBtn', () => breakLink(false));
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => toggleQuest(b.dataset.q));
  on('toTeacher', enterTeacher);
  on('quizBtn', startQuiz);
  if (!T) return;
  on('quizReset', () => { delete s.bonus; save(); render(); toast('오늘 퀴즈를 다시 열었어요'); });
  on('wAdd', addWordInput);
  on('wKo', e => { if (e.key === 'Enter' && !e.isComposing) addWordInput(); }, 'onkeydown');
  on('wEn', e => { if (e.key === 'Enter' && !e.isComposing) document.getElementById('wKo').focus(); }, 'onkeydown');
  on('wBulk', bulkWords);
  document.querySelectorAll('[data-wdel]').forEach(b => b.onclick = () => { s.words = s.words.filter(w => w.id !== b.dataset.wdel); save(); render(); });
  /* 선생님 화면에서만 되는 것 */
  on('toDisplay', () => { unlocked = false; location.hash = ''; });
  on('addStudent', () => studentForm(null));
  on('editStudent', () => studentForm(s));
  on('menuBtn', backupMenu);
  on('installBtn', async () => { installEvt.prompt(); await installEvt.userChoice; installEvt = null; render(); });
  on('forceBtn', () => { if (confirm('오늘 이미 하나 끊었어요. 밀린 날을 채우려고 하나 더 끊을까요?')) breakLink(true); });
  on('undoBtn', undoLink);
  on('swapBtn', swapAnimal);
  document.querySelectorAll('[data-del]').forEach(b => b.onclick = () => delQuest(b.dataset.del));
  on('qAdd', addQuest);
  on('qText', e => { if (e.key === 'Enter' && !e.isComposing) addQuest(); }, 'onkeydown');
  on('qReset', resetQuests);
}

/* ---------- 선생님 화면 ---------- */
let unlocked = false;   /* 비밀번호를 맞게 넣으면 이 창이 열려 있는 동안만 선생님 화면 */
const isTeacher = () => location.hash === '#teacher' && (!state.pin || unlocked);
function enterTeacher(){
  if (!state.pin){ location.hash = 'teacher'; return; }
  if (location.hash === '#teacher') history.replaceState(null, '', location.pathname);
  openModal(`
    <h3>선생님 화면</h3>
    <label class="field">비밀번호<input id="pinIn" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <p class="muted" id="pinMsg" style="margin:0;min-height:1.4em"></p>
    <div class="m-actions"><span></span><span style="display:flex;gap:8px"><button class="btn" id="pinCancel">취소</button><button class="btn primary" id="pinOk">들어가기</button></span></div>`);
  const inp = document.getElementById('pinIn'); inp.focus();
  const go = () => {
    if (inp.value === state.pin){ unlocked = true; closeModal(); location.hash = 'teacher'; }
    else { document.getElementById('pinMsg').textContent = '비밀번호가 달라요'; inp.value = ''; inp.focus(); }
  };
  document.getElementById('pinOk').onclick = go;
  inp.onkeydown = e => { if (e.key === 'Enter') go(); };
  document.getElementById('pinCancel').onclick = closeModal;
}
function pinMenu(){
  openModal(`
    <h3>선생님 비밀번호</h3>
    <p class="muted" style="margin-top:0">학생 화면 아래 "선생님" 버튼을 누르면 이 비밀번호를 물어봐요. 비워 두면 비밀번호 없이 들어가요.</p>
    <label class="field">새 비밀번호 (숫자 4~8자리)<input id="pinNew" type="password" inputmode="numeric" maxlength="8" autocomplete="off"></label>
    <div class="m-actions"><button class="btn danger" id="pinOff">${state.pin ? '비밀번호 없애기' : ''}</button>
      <span style="display:flex;gap:8px"><button class="btn" id="pinBack">취소</button><button class="btn primary" id="pinSave">저장</button></span></div>`);
  document.getElementById('pinBack').onclick = backupMenu;
  document.getElementById('pinOff').onclick = () => { if (!state.pin) return; state.pin = ''; save(); toast('비밀번호를 없앴어요'); backupMenu(); };
  document.getElementById('pinSave').onclick = () => {
    const v = document.getElementById('pinNew').value.trim();
    if (!/^\d{4,8}$/.test(v)){ alert('숫자 4~8자리로 정해 주세요.'); return; }
    state.pin = v; save(); toast('비밀번호를 정했어요'); backupMenu();
  };
}
function swapAnimal(){
  const s = cur();
  openModal(`
    <h3>구할 친구 바꾸기</h3>
    <p class="muted" style="margin-top:0">끊은 고리 수(${s.current.links}/${LINKS})는 그대로 두고 친구만 바뀌어요.</p>
    <div class="pick" id="swapPick">${ANIMALS.map(a => `<button data-id="${a.id}" class="${a.id === s.current.animal ? 'on' : ''}" title="${esc(a.name)}">${art(a.id)}</button>`).join('')}</div>
    <div class="m-actions"><span></span><button class="btn" id="swapCancel">취소</button></div>`);
  document.querySelectorAll('#swapPick button').forEach(b => b.onclick = () => { s.current.animal = b.dataset.id; save(); closeModal(); render(); });
  document.getElementById('swapCancel').onclick = closeModal;
}
/* 주소에 #teacher를 직접 넣어도 비밀번호가 있으면 먼저 물어봄 */
const guardTeacher = () => { if (location.hash === '#teacher' && !isTeacher()) enterTeacher(); };
window.addEventListener('hashchange', () => { closeModal(); render(); window.scrollTo(0, 0); guardTeacher(); });
/* 같은 기기의 다른 창(선생님 화면 ↔ 학생 화면)에서 바꾼 내용을 바로 반영 */
window.addEventListener('storage', e => {
  if (e.key !== KEY) return;
  state = load();
  if (!document.getElementById('modal')) render();
});

/* ---------- 앱(PWA) ---------- */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (!document.getElementById('modal')) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast('홈 화면에 바다 구조대가 생겼어요'); render(); });
if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
/* 브라우저가 저장 공간이 부족할 때 기록을 지우지 않도록 요청 */
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

render();
guardTeacher();
/* 자정이 지나면 화면을 새로 그림 */
let lastDay = today();
setInterval(() => { if (today() !== lastDay){ lastDay = today(); if (!document.getElementById('modal')) render(); } }, 30000);
</script>
</body>
</html>
