<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LucyApps</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
:root{--bg:#F6F4FB;--card:#fff;--ink:#2A2840;--soft:#6B6886;--line:#E2DEF0}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto;display:grid;gap:20px}
h1{font-family:"Jua",sans-serif;font-weight:400;font-size:40px;margin:0}
p{margin:0;color:var(--soft)}
.apps{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
a.app{display:grid;gap:6px;padding:20px;border-radius:20px;background:var(--card);border:3px solid var(--c);text-decoration:none;color:inherit;box-shadow:0 5px 0 var(--c)}
a.app:active{transform:translateY(4px);box-shadow:0 1px 0 var(--c)}
a.app:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
a.app b{font-family:"Jua",sans-serif;font-weight:400;font-size:26px}
a.app span{color:var(--soft);font-size:15px}
</style>
</head>
<body>
<div class="wrap">
  <div><h1>LucyApps</h1><p>영어 과외 시간에 쓰는 작은 앱 모음</p></div>
  <div class="apps">
    <a class="app" href="sea-rescue/" style="--c:#3f948a"><b>바다 구조대</b><span>지문 하나 끝낼 때마다 고리를 끊어 바다 친구를 구해요</span></a>
    <a class="app" href="block-tower/" style="--c:#2F6BFF"><b>블록 타워 미션</b><span>미션 블록을 모아 6층 타워를 쌓아요</span></a>
  </div>
</div>
</body>
</html>
